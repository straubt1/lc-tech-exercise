[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-tech-exercise"
version = "0.1.0"
description = "Human-gated review of a Terraform module before publish."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=1.0",
    "langsmith>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
